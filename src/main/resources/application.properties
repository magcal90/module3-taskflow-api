spring.application.name=taskflow-api
spring.profiles.active=jpa

# AI Configuration
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.chat.temperature=0.7
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Enables the H2 console, which is a UI for the H2 database.
spring.h2.console.enabled=true
# The URL path to the H2 console.
spring.h2.console.path=/h2
# The JDBC URL for the H2 database.
spring.datasource.url=jdbc:h2:mem:taskflow-api

# Application logging
logging.level.root=INFO
logging.level.sg.edu.ntu.taskflowapi=DEBUG

# Reduce framework noise
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Application time zone
app.time-zone=Asia/Singapore
