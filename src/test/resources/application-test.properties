spring.datasource.url=jdbc:h2:mem:taskflow-integration-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# OpenAI API configuration for testing
spring.ai.openai.api-key=test-placeholder

# Application logging
logging.level.root=INFO
logging.level.sg.edu.ntu.taskflowapi=DEBUG

# Reduce framework noise
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Application time zone
app.time-zone=Asia/Singapore
