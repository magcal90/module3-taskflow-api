spring.datasource.url=jdbc:h2:mem:taskflow-integration-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Controller validation remains enabled. Disabling persistence lifecycle validation
# lets query/summary tests seed historical tasks that the public API no longer accepts.
spring.jpa.properties.jakarta.persistence.validation.mode=none

# Keep the real OpenAI auto-configuration and ChatClient used by production.
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.chat.temperature=0.7
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Application logging
logging.level.root=INFO
logging.level.sg.edu.ntu.taskflowapi=DEBUG

# Reduce framework noise
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Application time zone
app.time-zone=Asia/Singapore
